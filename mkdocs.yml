---
site_name: Grid Doctor
site_description: Convert lat/lon xarray datasets to HEALPix pyramids.
site_url: https://grid-doctor.org/
repo_url: https://github.com/freva-org/grid-doctor
repo_name: freva-org/grid-doctor
site_dir: site
docs_dir: docs

nav:
  - Overview: index.md
  - Getting started: getting-started.md
  - Recipes:
      - Overview: recipes/index.md
      - Structured grids (ERA5, CMIP): recipes/structured.md
      - Unstructured grids (ICON): recipes/icon.md
      - Regional grids (CORDEX): recipes/regional.md
      - Point data: recipes/point-data.md
      - Coarsening and averaging masked fields: recipes/averaging.md
      - Parallel writes: recipes/parallel-writes.md
      - Working with the data: high-level-access.md
  - API reference:
      - Overview: api/index.md
      - Remapping: api/remap.md
      - Weights store: api/weights.md
      - Pyramids: api/pyramid.md
      - Point binning: api/swath.md
      - Writing stores: api/io.md
      - Parallel writes: api/parallel.md
      - Region selection: api/select.md
      - Metadata: api/metadata.md
      - Configuration: api/config.md
      - Types: api/types.md
      - Command line: api/cli.md
  - Technical decisions: technical-decisions.md
exclude_docs: |
  shared/**
  overrides/

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/logo-mark.svg
  favicon: assets/favicon.ico
  icon:
    admonition:
      example: material/database
    previous: fontawesome/solid/angle-left
    next: fontawesome/solid/angle-right

  # Three-way switcher: system preference (the default), light, dark.
  # The colours themselves are set in assets/styles.css.
  palette:
    - media: "(prefers-color-scheme)"
      primary: custom
      accent: custom
      toggle:
        icon: lucide/sun-moon
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: lucide/sun
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: lucide/moon
        name: Switch to system preference
  features:
    - content.code.copy
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.footer
    - navigation.path
    - search.highlight
    - search.suggest

plugins:
  - search
  - social:
      enabled: !ENV [SOCIAL_CARDS, false]
      cards_layout_options:
        background_image: docs/assets/modis-aqua.png
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            merge_init_into_class: true
            scoped_crossrefs: true
            relative_crossrefs: true

markdown_extensions:
  - admonition
  - footnotes
  - pymdownx.details
  - md_in_html
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tasklist:
      custom_checkbox: true  # clickable checkboxes in roadmap
  - pymdownx.emoji:
      emoji_index: !!python/name:zensical.extensions.emoji.twemoji
      emoji_generator: !!python/name:zensical.extensions.emoji.to_svg
  - pymdownx.arithmatex:
      generic: true
  - tables
  - attr_list
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      # docs/technical-decisions.md and docs/high-level-access.md include
      # their pages from docs/shared/; fail if an included file is missing.
      base_path: [.]
      check_paths: true
  - pymdownx.blocks.caption
  - toc:
      permalink: true

extra:
  version:
    # Versions are deployed with mike, see .github/workflows/docs.yaml.
    provider: mike
    alias: true
    # Pages of other versions show the outdated banner (overrides/main.html).
    default: [latest, dev]

extra_css:
  - assets/styles.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
