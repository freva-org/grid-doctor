[build-system]
requires = ["flit_core>=3.4,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "grid-doctor"
description = "Convert lat/lon xarray datasets to HEALPix pyramids and save to S3. Your lat/lon data goes to rehab and comes out HEALed."
dynamic = ["version"]
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "DKRZ", email = "data@dkrz.de"},
]
maintainers = [
    {name = "DKRZ", email = "data@dkrz.de"},
]
keywords = [
    "healpix",
    "xarray",
    "zarr",
    "geospatial",
    "regridding",
    "climate",
    "earth-observation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: GIS",
]
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "xarray>=2025.1",
    "requests",
    "healpix-geo",
    "zarr>=3",
    "s3fs",
    "scipy",
    "fsspec",
    "numcodecs",
    "dask[array]",
    "numba",
    "numpy_groupies",
    "h5netcdf",
    "platformdirs>=3",
    "tomlkit",
]


[project.optional-dependencies]
gpu = ["cupy"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "ruff>=0.1",
    "black>=23.0",
    "pre-commit>=3.0",
    "tox>=4",
    "types-requests",
]
tests = [
    "pytest",
    "pytest-env",
    "mock",
    "pytest-mock",
    "pytest-cov",
    "pytest-xdist",
    "healpy",
    "pandas>=2.2",
    "bottleneck",
    "cftime",
    "netCDF4",
    "numexpr",
    "reflow-hpc",
    "jsonschema",
    "xdggs; python_version >= '3.12'",
]
docs = [
    "zensical>=0.1.3,<0.2",
    "mkdocstrings[python]>=0.27",
    "pymdown-extensions>=10.0",
]
all = [
    "grid-doctor[dev,tests,docs]",
]

[project.urls]
Homepage = "https://grid-doctor.org"
Documentation = "https://grid-doctor.org"
Repository = "https://github.com/freva-org/grid-doctor"

[tool.mypy]
files = ["src/grid_doctor"]
strict = true
warn_unused_ignores = true
warn_unreachable = true
show_error_codes = true
install_types = true
non_interactive = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_redundant_casts = true
ignore_missing_imports = true
allow_untyped_calls = true

[[tool.mypy.overrides]]
# New code: no explicit Any.  Use the aliases in grid_doctor.types.
module = ["grid_doctor.io.*", "grid_doctor.metadata.*"]
disallow_any_explicit = true

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
# E/W/F: pycodestyle and pyflakes (was flake8), I: import order (was isort),
# D: docstrings (was pydocstyle), S: security (was bandit).
select = ["E", "W", "F", "I", "D", "S"]
ignore = [
    "F403",  # star imports, as with flake8 before
    "F405",
    # bandit only failed on medium severity and above; these are low:
    "S101",  # assert
    "S603",  # subprocess call without shell=True
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.isort]
known-first-party = ["grid_doctor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --cov=grid_doctor --cov-report=term-missing"

[tool.coverage.run]
source = ["grid_doctor"]
branch = false

[tool.coverage.report]
ignore_errors = false
exclude_lines = [
    "pragma: no cover",
    "noqa",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
     "except ImportError:",
]

[tool.codespell]
ignore-words-list = "te,nd,fo,ist,orcestra,cdo,COO"
skip = "docs/assets/logos/*.svg"
dictionary = ".codespell-dictionary,-"

[tool.tox]
legacy_tox_ini = """
[tox]
min_version = 4.0
env_list = docs, types, lint
[testenv]
passenv = *
parallel_show_output = false

[testenv:lint]
description = "Check code quality. Usage: tox -e lint [-- FILES]"
skip_install = true
deps = ruff
       codespell
commands =
    ruff check {posargs:src}
    ruff format --check {posargs:src}
    codespell --quiet-level=2 {posargs:src/}

[testenv:format]
description = "Apply ruff fixes and formatting. Usage: tox -e format [-- FILES]"
skip_install = true
deps = ruff
commands =
    ruff check --fix {posargs:src}
    ruff format {posargs:src}

[testenv:test]
# System site packages (conda) provide ESMF/ESMPy. pytest would also
# auto-load every plugin registered there, even ones whose module the env
# shadows (e.g. platformdirs.pytest_plugin), so load plugins explicitly.
setenv =
    VIRTUALENV_SYSTEM_SITE_PACKAGES=true
    PYTEST_DISABLE_PLUGIN_AUTOLOAD=1
description = "Run the unit tests."
# Keep system packages available for external libraries, but install declared
# dependencies locally so they take precedence over inherited packages.
install_command = python -I -m pip install --ignore-installed {opts} {packages}
deps = -e .[tests]
commands =
    python3 -m pytest -vv -p pytest_cov -p xdist.plugin -n auto --cov=grid_doctor --cov-report=html:coverage_report --junitxml report.xml --cov-report xml tests/
    python3 -m coverage report --fail-under=65 --precision=2

[testenv:docs]
description = Build docs. Usage: tox -e docs
deps =
    -e .[docs]
    codespell
commands =
    {[testenv:docs-spell]commands}
    zensical build --clean --strict

[testenv:docs-spell]
description = Spell-check docs. Usage: tox -e docs-spell [-- FILES]
skip_install = true
deps = codespell
commands =
    codespell --quiet-level=2 {posargs:docs}

[testenv:docs-serve]
description = Serve docs locally. Usage: tox -e docs-serve
deps =
    {[testenv:docs]deps}
commands =
    codespell --quiet-level=2 docs
    zensical serve -a localhost:8000

[testenv:docs-deploy]
description = Deploy a docs version with mike. Usage: tox -e docs-deploy -- deploy --push dev
# Zensical's fork of mike is not on PyPI, and PyPI rejects packages whose
# metadata points at a git URL, so it is installed here, not in the docs
# extra.  Transitional until Zensical versions docs natively, see
# https://zensical.org/docs/compatibility/mkdocs/mike/
deps =
    {[testenv:docs]deps}
    mike @ git+https://github.com/squidfunk/mike.git@0f62791256ebeba60d20d2f1d8fe6ec3b7d1e2b3
commands =
    mike {posargs:list}

[testenv:types]
description = Run mypy in strict mode
deps = -e .
    mypy>=1.11
    types-requests
    numpy
    xarray
commands =
    mypy src/grid_doctor
"""
