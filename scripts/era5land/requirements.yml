# Extra packages layered on top of the main grid_doctor environment for the
# ERA5/ERA5-Land conversion workflow under scripts/era5land/.
channels:
  - conda-forge
dependencies:
  # GRIB reading
  - cfgrib
  - eccodes
  # Auxiliary workflow / data-access helpers
  - kerchunk
  - pyarrow
  - python-dotenv
  # Regridding stack used by grid_doctor
  - "esmf=*=mpi_openmpi_*"
  - esmpy
  - pip:
    - reflow-hpc
