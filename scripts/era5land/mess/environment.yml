name: climate_remap
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - numpy
  - xarray
  - cfgrib        # Necessary for loading the source GRIB files
  - eccodes       # Backend engine required by cfgrib
  - esmpy         # Core Earth System Modeling Framework Python bindings
  - xesmf         # High-level regridding wrapper
  - uxarray       # Unstructured grid geometry engine for reduced Gaussian data
  - netcdf4       # For saving compressed output files
  - dask          # Enables parallelized array processing for larger arrays
  - scipy         # Required internally by xESMF for sparse matrix operations