name: CI

permissions:
  contents: read
  pull-requests: write

on:
  push:
    paths:
      - "src/**"
      - ".github/workflows/ci.yml"
  pull_request:
    pahts:
      - "src/**"
      - ".github/workflows/ci.yml"

  workflow_dispatch:

  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install tox
        run: pip install tox

      - name: Run linters
        run: tox -e lint

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup micromamba
        uses: mamba-org/setup-micromamba@v1
        with:
          micromamba-version: "latest"
          environment-name: grid-doctor
          cache-environment: true
          create-args: >-
            python=3.13
            pip
          condarc: |
            channels:
              - conda-forge
            channel_priority: strict
          init-shell: bash

      - name: Install packages
        shell: bash -l {0}
        run: |
          python -m pip install -e .[dev]
          pip install tox

      - name: Run type checker
        shell: bash -l {0}
        run: tox -e types

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup micromamba
        uses: mamba-org/setup-micromamba@v1
        with:
          micromamba-version: "latest"
          environment-name: grid-doctor
          cache-environment: true
          create-args: >-
            python=3.13
            pip
          condarc: |
            channels:
              - conda-forge
            channel_priority: strict
          init-shell: bash

      - name: Install packages
        shell: bash -l {0}
        run: |
          python -m pip install -e .[dev]
          pip install tox

      - name: Build docs (strict)
        shell: bash -l {0}
        run: tox -e docs

  tests:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 5
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup micromamba
        uses: mamba-org/setup-micromamba@v1
        with:
          micromamba-version: "latest"
          environment-name: grid-doctor
          cache-environment: true
          create-args: >-
            python=${{ matrix.python-version }}
            gdal
            rasterio
            h5py
            h5netcdf
            hdf5
            netcdf4
            pip
            cfgrib
            xarray
            cffi
            tox
          condarc: |
            channels:
              - conda-forge
            channel_priority: strict
          init-shell: bash

      - name: Install Python packages
        shell: bash -l {0}
        run: python -m pip install -e .[dev]

      - name: Run tests
        shell: bash -l {0}
        run: tox -e test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true

  benchmarks:
    # Base and PR run on the same runner, so their timings are comparable.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup micromamba
        uses: mamba-org/setup-micromamba@v1
        with:
          micromamba-version: "latest"
          environment-name: grid-doctor
          cache-environment: true
          create-args: >-
            python=3.13
            netcdf4
            pip
          condarc: |
            channels:
              - conda-forge
            channel_priority: strict
          init-shell: bash

      - name: Install packages
        shell: bash -l {0}
        run: python -m pip install -e .[tests,bench]

      - name: Benchmark base branch
        shell: bash -l {0}
        # The PR's benchmarks run against the base branch's source. May fail
        # when they use functions the base does not have yet.
        continue-on-error: true
        run: |
          git checkout origin/${{ github.base_ref }} -- src
          python -m pytest benchmarks -o addopts= --benchmark-save=base
          git checkout HEAD -- src

      - name: Benchmark PR and compare
        shell: bash -l {0}
        run: |
          git checkout HEAD -- src
          if ls .benchmarks/*/*_base.json >/dev/null 2>&1; then
            python -m pytest benchmarks -o addopts= \
              --benchmark-compare=0001 --benchmark-compare-fail=min:30% \
              --benchmark-columns=min,mean,stddev,rounds
          else
            python -m pytest benchmarks -o addopts= --benchmark-columns=min,mean,stddev,rounds
          fi
