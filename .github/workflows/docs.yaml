name: Deploy Docs

# Pull requests are covered by the `docs` job in ci.yaml. This workflow only
# publishes. src/** is included because the API reference is generated from
# docstrings.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "src/**"
      - "mkdocs.*.yml"
      - "pyproject.toml"
      - ".github/workflows/docs.yaml"
      - ".github/workflows/docs-build.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/docs-build.yaml
    with:
      social-cards: true
      upload-pages-artifact: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
