name: Deploy Docs

# Builds the documentation with Zensical and mike and pushes it to the gh-pages branch,
# which GitHub Pages serves at https://grid-doctor.org:
#
#   push to main         -> version "dev"
#   tag vX.Y.Z           -> version "X.Y" with the alias "latest"
#
# The site root redirects to "latest", which is "dev" until the first release.
# Pull requests only build the docs (the docs job in ci.yaml).  src/** is
# included because the API reference is generated from docstrings.
on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
    # Not evaluated for tags: every release tag deploys.
    paths:
      - "docs/**"
      - "src/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - ".github/workflows/docs.yaml"
  workflow_dispatch:

permissions:
  contents: write

# mike commits to gh-pages; two deploys must not push at the same time.
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOCIAL_CARDS: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # mike needs the gh-pages history
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install "tox>=4"
      - name: Configure git for mike
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Deploy release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          version="${version%.*}"  # 1.2.3 -> 1.2: patch releases update their minor version
          tox -e docs-deploy -- deploy --push --update-aliases "$version" latest
          tox -e docs-deploy -- set-default --push latest
      - name: Deploy dev
        if: github.ref == 'refs/heads/main'
        run: |
          # Until the first release, "dev" also carries the alias "latest",
          # so links to grid-doctor.org/latest/ (e.g. from the pages shared
          # with the Waterpark docs) work from the start.  A release takes
          # the alias over.
          git fetch origin gh-pages || true  # absent before the first deploy
          if git show origin/gh-pages:versions.json 2>/dev/null \
              | python -c 'import json, sys; sys.exit(not any(v["version"] != "dev" for v in json.loads(sys.stdin.read() or "[]")))'; then
            tox -e docs-deploy -- deploy --push dev
          else
            tox -e docs-deploy -- deploy --push --update-aliases dev latest
            tox -e docs-deploy -- set-default --push latest
          fi
