name: Deploy Docs

permissions:
  contents: write
  pages: write
  id-token: write

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js (for STAC Browser build)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup micromamba
        uses: mamba-org/setup-micromamba@v1
        with:
          micromamba-version: "latest"
          environment-name: grid-doctor
          cache-environment: true
          create-args: >-
            python=3.13
            pip
          condarc: |
            channels:
              - conda-forge
            channel_priority: strict
          init-shell: bash

      - name: Install packages
        shell: bash -l {0}
        run: |
          python -m pip install -e .[dev]
          pip install tox

      - name: Build technical docs
        shell: bash -l {0}
        run: tox -e docs -- tech

      - name: Upload technical docs artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-tech/

      - name: Build data docs
        shell: bash -l {0}
        run: tox -e docs -- data

      - name: Deploy data docs to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site-data
          publish_branch: gh-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy technical docs to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
