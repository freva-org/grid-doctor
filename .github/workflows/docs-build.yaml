name: Build docs

on:
  workflow_call:
    inputs:
      social-cards:
        type: boolean
        default: false
      upload-pages-artifact:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install "tox>=4"
      - name: Build technical docs (strict)
        env:
          SOCIAL_CARDS: ${{ inputs.social-cards && 'true' || 'false' }}
        run: tox -e docs
      - name: Upload Pages artifact
        if: inputs.upload-pages-artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site-tech/
